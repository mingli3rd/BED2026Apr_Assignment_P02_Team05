<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEA Officer Portal — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-badge">
      <span class="login-badge-mark">NEA</span>
      <span class="login-badge-text">Officer Portal</span>
    </div>

    <h1>Officer Login</h1>
    <p class="subtitle">Log in to record stall inspections and issue hygiene grades.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@nea.gov.sg" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Log In</button>

      <p id="message" class="form-message" role="status" aria-live="polite"></p>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
