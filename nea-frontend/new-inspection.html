<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule Inspection — NEA Officer Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="portal-badge">
        <span class="login-badge-mark">NEA</span>
        <span class="login-badge-text" style="color:white;">Officer Portal</span>
      </div>

      <nav class="portal-nav">
        <a href="dashboard.html" class="portal-nav-link">Overview</a>
        <a href="new-inspection.html" class="portal-nav-link is-active">Schedule Inspection</a>
        <a href="conduct-inspection.html" class="portal-nav-link">Conduct &amp; Log</a>
        <a href="inspections.html" class="portal-nav-link">My Inspections</a>
      </nav>

      <div class="portal-sidebar-footer">
        <span class="portal-officer-name" id="officerName">Loading...</span>
        <button class="portal-logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </aside>

    <main class="portal-main">
      <p class="portal-eyebrow">Schedule Inspection</p>
      <h1 class="portal-title">Assign an inspection visit.</h1>

      <div class="portal-panel" style="max-width: 560px;">
        <form id="inspectionForm" novalidate>
          <div class="field">
            <label for="vendorSelect">Stall</label>
            <select id="vendorSelect" required>
              <option value="" disabled selected>Loading stalls...</option>
            </select>
          </div>

          <div class="field">
            <label for="scheduledDateInput">Inspection Date</label>
            <input type="date" id="scheduledDateInput" required />
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Schedule Inspection</button>

          <p id="message" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
  </div>

  <script src="js/new-inspection.js"></script>
</body>
</html>
