<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favourites — SG Hawker Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body class="dashboard-body">

  <div class="dashboard-shell">
    <aside class="dash-sidebar">
      <a href="index.html" class="board-logo dash-logo">
        <span class="board-logo-mark">SG</span>
        <span class="board-logo-text">HAWKER HUB</span>
      </a>

      <nav class="dash-nav" aria-label="Dashboard navigation">
        <a href="profile.html" class="dash-nav-link">
          <span class="stall-no">01</span> Profile
        </a>
        <a href="patron-orders.html" class="dash-nav-link">
          <span class="stall-no">02</span> My Orders
        </a>
        <a href="favourites.html" class="dash-nav-link is-active">
          <span class="stall-no">03</span> Favourites
        </a>
      </nav>

      <div class="dash-sidebar-footer">
        <a href="index.html" class="dash-nav-link dash-back-link">← Back to Site</a>
        <button id="logoutBtn" class="dash-logout-btn">Log Out</button>
      </div>
    </aside>

    <main class="dash-main">
      <div id="dashboardLoading" class="dashboard-loading">Loading your favourites...</div>
      <div id="dashboardError" class="form-message is-warning" style="display:none;"></div>

      <div id="dashboardContent" class="dashboard-content" style="display:none;">
        <div class="dash-header">
          <div>
            <p class="eyebrow">Favourites</p>
            <h1 class="dash-welcome">Your saved stalls.</h1>
          </div>
        </div>

        <div id="favouritesGrid" class="directory-grid"></div>

        <div id="emptyState" class="dash-empty-state" style="display:none;">
          <p>You haven't favourited any stalls yet. <a href="stalls.html">Browse stalls</a> and tap the ♥ on any you like.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/favourites.js"></script>
</body>
</html>
