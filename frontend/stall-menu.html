<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order — SG Hawker Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <header class="directory-board">
    <div class="board-inner">
      <a href="index.html" class="board-logo">
        <span class="board-logo-mark">SG</span>
        <span class="board-logo-text">HAWKER HUB</span>
      </a>

      <nav class="board-nav" aria-label="Main navigation">
        <a href="index.html" class="board-link"><span class="stall-no">01</span>Home</a>
        <a href="stall-menu.html" class="board-link is-active"><span class="stall-no">02</span>Order</a>
        <a href="hygiene.html" class="board-link"><span class="stall-no">03</span>Hygiene Grades</a>
        <a href="credit.html" class="board-link"><span class="stall-no">04</span>Credits</a>
      </nav>

      <div class="board-auth" id="boardAuth">
        <div class="auth-dropdown" id="signUpDropdown">
          <button type="button" class="auth-dropdown-toggle">Sign Up <span class="chevron">▾</span></button>
          <div class="auth-dropdown-menu">
            <a href="vendor-register.html">As a Vendor</a>
            <a href="patron-register.html">As a Patron</a>
          </div>
        </div>
        <div class="auth-dropdown" id="loginDropdown">
          <button type="button" class="auth-dropdown-toggle auth-dropdown-toggle-primary">Log In <span class="chevron">▾</span></button>
          <div class="auth-dropdown-menu">
            <a href="vendor-login.html">As a Vendor</a>
            <a href="patron-login.html">As a Patron</a>
          </div>
        </div>
        <a href="cart.html" class="cart-icon-link" id="cartIconLink">
          🛒 <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
        </a>
      </div>

      <button class="board-menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="stall-menu-section">
      <img src="images/stall-banner.svg" alt="" class="stall-banner-img" />

      <div class="stall-menu-header">
        <div>
          <p class="eyebrow" id="stallEyebrow">Loading stall...</p>
          <h1 class="section-title" id="stallName">—</h1>
        </div>

        <div class="stall-picker">
          <label for="stallSelect">Switch Stall</label>
          <select id="stallSelect"></select>
        </div>
      </div>

      <div id="menuLoading" class="dashboard-loading">Loading menu...</div>
      <div id="menuError" class="form-message is-warning" style="display:none;"></div>

      <div id="menuGrid" class="stall-item-grid"></div>
    </section>
  </main>

  <!-- Add-on selection modal -->
  <div id="addOnModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3 id="modalItemName">Item</h3>
      <p class="modal-item-price" id="modalItemPrice"></p>

      <div id="modalAddOns" class="modal-addons"></div>

      <div class="field">
        <label for="modalQuantity">Quantity</label>
        <input type="number" id="modalQuantity" min="1" max="50" value="1" />
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="modalAddBtn">Add to Cart — <span id="modalTotalPrice">$0.00</span></button>
        <button class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none;"></div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="board-logo-mark small">SG</span>
        <span>HAWKER HUB</span>
      </div>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="hygiene.html">Hygiene Grades</a>
        <a href="credit.html">Credits</a>
      </nav>
      <p class="footer-note">Built for BED Assignment · Diploma in Information Technology · Ngee Ann Polytechnic</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/stall-menu.js"></script>
</body>
</html>
